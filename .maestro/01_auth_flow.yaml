appId: com.james.klir
---
- launchApp:
    clearState: true

# 1. Check initial Login Screen elements
- assertVisible: "Smart Flush Field"
- assertVisible: "Login"
- assertVisible: "Email"
- assertVisible: "Password"

# 2. Test Invalid Credentials Error Handling
- tapOn: "Email"
- inputText: "technician@smartflush.com"
- hideKeyboard
- tapOn: "Password"
- inputText: "WrongPassword!999"
- hideKeyboard

- tapOn: "Login"
- assertVisible: ".*(Incorrect password|invalid|Unable to log in).*"

# 3. Successful Sign-in with Valid Technician Account
- tapOn: "Password"
- eraseText
- inputText: "TechnicianPass123"
- hideKeyboard

- tapOn: "Login"

# 4. Verify Inbox Screen Loaded
- assertVisible: "Today's Tasks"
- assertVisible: "Pending"

# 5. Test Logout Flow
- tapOn:
    text: "Log out"
    optional: true
- tapOn:
    text: "Log out"
    optional: true
- assertVisible: "Login"
